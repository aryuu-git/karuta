server {
    listen 80;
    server_name _;

    # 允许上传最大 30MB（音频 20MB + 封面 5MB + 余量）
    client_max_body_size 30M;

    # Compress text assets for weak-network clients. Brotli can be enabled as
    # well when the nginx module is installed on the target server.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态文件
    # Frontend and backend share the same atomic release pointer. Switching
    # /opt/karuta/current therefore changes both sides of the deployment.
    root /opt/karuta/current/frontend/dist;
    index index.html;

    # Vite content-hashed assets are immutable and safe to cache for one year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 前端 SPA：入口不长期缓存，所有未匹配路由回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 反向代理
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 上传文件静态服务（由 Go 服务处理，无需 nginx 直接服务）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
